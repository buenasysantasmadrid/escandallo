<!DOCTYPE html>
<!-- Esta página la sirve Code.gs (HtmlService). No abrir directamente. -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4f3a">
<title>Escandallo · Buenas y Santas</title>
<style>
:root{
  --verde:#2f4f3a; --verde2:#4b7a5a; --crema:#faf7f0; --tinta:#1f2421; --gris:#6b716d; --linea:#e6e1d6;
  --ok:#2e7d4f; --okbg:#e3f2e8; --warn:#9a6a00; --warnbg:#fff1cc; --mal:#b3261e; --malbg:#fbe1df; --card:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--crema);color:var(--tinta);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--verde);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:17px;margin:0;flex:1;letter-spacing:.2px}
.top h1 small{display:block;font-weight:400;opacity:.75;font-size:12px}
.mes{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:6px 8px;font:inherit;font-size:14px;color-scheme:dark}
button.icono{background:none;border:0;color:#fff;font-size:20px;padding:6px;cursor:pointer}
nav{display:flex;gap:4px;margin-top:10px}
nav button{flex:1;background:none;border:0;color:rgba(255,255,255,.7);padding:10px 4px;font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;border-color:#e9c46a}
nav .badge{background:#e9c46a;color:var(--tinta);border-radius:10px;padding:0 6px;font-size:12px;margin-left:4px}
main{padding:12px 16px 90px;max-width:820px;margin:0 auto}
.buscar{width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:10px;font:inherit;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--linea);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--tinta)}
.chip.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.kpi{background:var(--card);border-radius:12px;padding:10px;border:1px solid var(--linea)}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:var(--gris)}
.lista{display:flex;flex-direction:column;gap:8px}
.fila{background:var(--card);border:1px solid var(--linea);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.fila .nom{flex:1;min-width:0}
.fila .nom b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .nom small{color:var(--gris);font-size:12.5px}
.der{text-align:right;white-space:nowrap}
.der b{display:block}
.der small{color:var(--gris);font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600}
.p-ok{background:var(--okbg);color:var(--ok)} .p-warn{background:var(--warnbg);color:var(--warn)} .p-mal{background:var(--malbg);color:var(--mal)} .p-gris{background:#eee;color:var(--gris)}
.sub{color:var(--mal);font-weight:600} .baj{color:var(--ok);font-weight:600}
.vacio{text-align:center;color:var(--gris);padding:40px 10px}
.cargando{text-align:center;color:var(--gris);padding:60px 0}
/* hoja de detalle */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.velo.on{display:block}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--crema);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .22s ease;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);max-width:820px;margin:0 auto}
.hoja.on{transform:none}
.asa{width:40px;height:4px;background:#ccc;border-radius:4px;margin:6px auto 12px}
.cerrar{position:sticky;top:0;float:right;background:#e9e4d8;border:0;border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer;color:var(--tinta)}
.hoja h2{margin:0 0 2px;font-size:19px}
.hoja .meta{color:var(--gris);font-size:13px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--linea)}
th,td{padding:8px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--linea)}
th{background:#f3efe6;font-size:12px;color:var(--gris);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;background:#f3efe6}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.campo label{display:block;font-size:12px;color:var(--gris);margin-bottom:4px}
.campo input,.campo select{width:100%;padding:10px;border:1px solid var(--linea);border-radius:10px;font:inherit;background:#fff}
.btn{background:var(--verde);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn:disabled{opacity:.5}
.btn.sec{background:#fff;color:var(--verde);border:1px solid var(--verde)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:10px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.pend{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px}
.pend .grid{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:10px}
.nota{font-size:12.5px;color:var(--gris);margin:8px 0}
@media (min-width:700px){.resumen{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app"><div class="cargando">Cargando…</div></div>
<div class="velo" id="velo"></div>
<div class="hoja" id="hoja"></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const eur = (n, d = 2) => n == null ? '—' : n.toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' €';
const pct = n => n == null ? '—' : (n * 100).toLocaleString('es-ES', { maximumFractionDigits: 1 }) + ' %';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const leer = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

const st = { datos: null, tab: leer('esc_tab') || 'carta', cat: 'Todas', q: '', soloSubidas: false };

// Llama a la función api() de Code.gs (mismo proyecto de Apps Script)
function llamar(params) {
  return new Promise((ok, ko) => {
    google.script.run
      .withSuccessHandler(txt => { const j = JSON.parse(txt); j.ok ? ok(j) : ko(new Error(j.error || 'Error')); })
      .withFailureHandler(e => ko(new Error(e && e.message ? e.message : String(e))))
      .api(params);
  });
}

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }

function cargar() {
  $('#app').innerHTML = '<div class="cargando">Cargando escandallo…</div>';
  llamar({ action: 'datos' }).then(j => { st.datos = j; pintar(); })
    .catch(e => { $('#app').innerHTML = `<div class="vacio">No se pudo cargar: ${esc(e.message)}<br><br><button class="btn sec" onclick="cargar()">Reintentar</button></div>`; });
}

function pintar() {
  const d = st.datos; const np = d.pendientes.length;
  $('#app').innerHTML = `
  <header>
    <div class="top">
      <h1>Escandallo<small>${esc(d.usuario || "Buenas y Santas")} · precios medios del mes</small></h1>
      <input type="month" class="mes" id="mes" value="${esc(d.config.mes)}">
      <button class="icono" id="recargar" title="Recargar">↻</button>
    </div>
    <nav>
      <button data-t="carta" class="${st.tab === 'carta' ? 'on' : ''}">Carta</button>
      <button data-t="ing" class="${st.tab === 'ing' ? 'on' : ''}">Ingredientes</button>
      <button data-t="pend" class="${st.tab === 'pend' ? 'on' : ''}">Facturas${np ? `<span class="badge">${np}</span>` : ''}</button>
    </nav>
  </header>
  <main id="cont"></main>`;
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { st.tab = b.dataset.t; st.q = ''; guardar('esc_tab', st.tab); pintar(); });
  $('#recargar').onclick = cargar;
  $('#mes').onchange = e => { const v = e.target.value; if (!v) return; $('#cont').innerHTML = '<div class="cargando">Recalculando…</div>'; llamar({ action: 'mes', fecha: v }).then(cargar).catch(err => toast(err.message)); };
  ({ carta: vistaCarta, ing: vistaIng, pend: vistaPend })[st.tab]();
}

function claseFc(p) {
  if (p.tipo === 'Elaboración') return ['p-gris', 'Elaboración'];
  if (p.aviso === 'PVP por debajo del mínimo') return ['p-mal', pct(p.fc)];
  if (p.aviso === 'Food cost alto') return ['p-warn', pct(p.fc)];
  if (p.fc == null) return ['p-gris', 'Sin PVP'];
  return ['p-ok', pct(p.fc)];
}

function vistaCarta() {
  const d = st.datos;
  const cats = ['Todas', ...new Set(d.platos.filter(p => p.tipo === 'Plato').map(p => p.cat)), 'Elaboraciones', 'Con aviso'];
  let L = d.platos.filter(p => {
    if (st.cat === 'Elaboraciones') return p.tipo === 'Elaboración';
    if (p.tipo === 'Elaboración') return false;
    if (st.cat === 'Con aviso') return p.aviso && p.aviso !== 'OK';
    return st.cat === 'Todas' || p.cat === st.cat;
  });
  if (st.q) L = L.filter(p => p.nombre.toLowerCase().includes(st.q.toLowerCase()));
  const carta = d.platos.filter(p => p.tipo === 'Plato' && p.fc != null);
  const fcMedio = carta.length ? carta.reduce((a, p) => a + p.fc, 0) / carta.length : null;
  const bajoMin = d.platos.filter(p => p.aviso === 'PVP por debajo del mínimo').length;
  const delMes = d.ingredientes.filter(i => i.origen === 'Facturas del mes').length;
  const compra = d.ingredientes.filter(i => i.tipo === 'Compra').length;
  $('#cont').innerHTML = `
    <div class="resumen">
      <div class="kpi"><b>${pct(fcMedio)}</b><span>Food cost medio</span></div>
      <div class="kpi"><b style="color:${bajoMin ? 'var(--mal)' : 'inherit'}">${bajoMin}</b><span>PVP bajo mínimo</span></div>
      <div class="kpi"><b>${delMes}/${compra}</b><span>Precios del mes</span></div>
    </div>
    <input class="buscar" id="q" placeholder="Buscar plato…" value="${esc(st.q)}">
    <div class="chips">${cats.map(c => `<button class="chip ${c === st.cat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="lista">${L.map((p, i) => { const [cl, tx] = claseFc(p); return `
      <div class="fila" data-i="${d.platos.indexOf(p)}">
        <div class="nom"><b>${esc(p.nombre)}</b><small>${esc(p.cat)} · coste ${eur(p.costeRacion, p.tipo === 'Elaboración' ? 3 : 2)}${p.tipo === 'Elaboración' ? ' / ' + esc(p.unidad === 'kg' ? 'kg' : 'ud') : ''}</small></div>
        <div class="der">${p.tipo === 'Plato' ? `<b>${eur(p.pvp)}</b>` : ''}<span class="pill ${cl}">${tx}</span></div>
      </div>`; }).join('') || '<div class="vacio">Nada que mostrar</div>'}</div>
    <p class="nota">Food cost = coste por ración ÷ PVP sin IVA. Mínimo = coste × coeficiente (${String(d.config.coef).replace('.', ',')}) + IVA.</p>`;
  $('#q').oninput = e => { st.q = e.target.value; const pos = e.target.selectionStart; vistaCarta(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); };
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { st.cat = b.dataset.c; vistaCarta(); });
  document.querySelectorAll('.fila').forEach(f => f.onclick = () => detallePlato(d.platos[f.dataset.i]));
}

function detallePlato(p) {
  const d = st.datos;
  const lin = d.recetas.filter(r => r.plato === p.nombre);
  const ingIdx = Object.fromEntries(d.ingredientes.map(i => [i.nombre, i]));
  const total = lin.reduce((a, r) => a + (r.coste || 0), 0);
  const esPlato = p.tipo === 'Plato';
  abrirHoja(`
    <h2>${esc(p.nombre)}</h2>
    <div class="meta">${esc(p.cat)} · receta para ${String(p.rend).replace('.', ',')} ${p.rend != 1 && p.unidad === 'ración' ? 'raciones' : esc(p.unidad)}</div>
    <div class="resumen">
      <div class="kpi"><b>${eur(p.costeRacion, esPlato ? 2 : 3)}</b><span>Coste / ${esPlato ? 'ración' : esc(p.unidad)}</span></div>
      ${esPlato ? `<div class="kpi"><b>${eur(p.pvpMin)}</b><span>PVP mínimo</span></div>
      <div class="kpi"><b>${pct(p.fc)}</b><span>Food cost</span></div>` : ''}
    </div>
    <table><thead><tr><th>Ingrediente</th><th class="n">Cant.</th><th class="n">€/ud</th><th class="n">Coste</th></tr></thead><tbody>
    ${lin.map(r => { const ig = ingIdx[r.ing] || {}; const v = ig.variacion;
      return `<tr><td>${esc(r.ing)}<br><small style="color:var(--gris)">${esc(ig.origen || '')}${v != null && Math.abs(v) >= 0.01 ? ` · <span class="${v > 0 ? 'sub' : 'baj'}">${v > 0 ? '+' : ''}${pct(v)}</span>` : ''}</small></td>
      <td class="n">${String(r.cant).replace('.', ',')} ${esc(r.unidad)}</td><td class="n">${eur(r.precio, 3)}</td><td class="n">${eur(r.coste)}</td></tr>`; }).join('')}
    </tbody><tfoot><tr><td colspan="3">Total receta</td><td class="n">${eur(total)}</td></tr></tfoot></table>
    ${p.coste2021 != null ? `<p class="nota">Coste por ración en el Excel 2021: ${eur(p.coste2021, esPlato ? 2 : 3)}</p>` : ''}
    ${esPlato ? `
    <div class="edit">
      <div class="campo"><label>PVP carta (IVA incl.)</label><input id="ePvp" inputmode="decimal" value="${p.pvp != null ? String(p.pvp).replace('.', ',') : ''}"></div>
      <div class="campo"><label>Coeficiente (vacío = ${String(d.config.coef).replace('.', ',')})</label><input id="eCoef" inputmode="decimal" value="${p.coef != null ? String(p.coef).replace('.', ',') : ''}"></div>
    </div>
    <button class="btn" id="eGuardar">Guardar cambios</button>` : ''}
    <p class="nota">Para cambiar ingredientes o cantidades, edita la hoja RECETAS del Google Sheet.</p>`);
  if (esPlato) $('#eGuardar').onclick = async () => {
    const b = $('#eGuardar'); b.disabled = true; b.textContent = 'Guardando…';
    try {
      const pvp = $('#ePvp').value.trim(), coef = $('#eCoef').value.trim();
      if (pvp && pvp !== String(p.pvp ?? '').replace('.', ',')) await llamar({ action: 'pvp', plato: p.nombre, valor: pvp });
      if (coef !== String(p.coef ?? '').replace('.', ',')) await llamar({ action: 'coef', plato: p.nombre, valor: coef });
      cerrarHoja(); toast('Guardado'); cargar();
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Guardar cambios'; }
  };
}

function vistaIng() {
  const d = st.datos;
  let L = d.ingredientes.filter(i => i.tipo !== 'Fijo');
  if (st.soloSubidas) L = L.filter(i => i.variacion != null && i.variacion > 0.1);
  if (st.q) L = L.filter(i => i.nombre.toLowerCase().includes(st.q.toLowerCase()));
  const ori = { 'Facturas del mes': 'p-ok', 'Facturas (histórico)': 'p-warn', 'Ref. 2021': 'p-mal', 'Receta propia': 'p-gris' };
  $('#cont').innerHTML = `
    <input class="buscar" id="q" placeholder="Buscar ingrediente…" value="${esc(st.q)}">
    <div class="chips"><button class="chip ${st.soloSubidas ? '' : 'on'}" id="cTodos">Todos</button><button class="chip ${st.soloSubidas ? 'on' : ''}" id="cSub">Subidas &gt; 10 % vs 2021</button></div>
    <div class="lista">${L.map(i => `
      <div class="fila" style="cursor:default">
        <div class="nom"><b>${esc(i.nombre)}</b><small><span class="pill ${ori[i.origen] || 'p-gris'}">${esc(i.origen)}</span>${i.lineas ? ` · ${i.lineas} línea${i.lineas > 1 ? 's' : ''} este mes` : ''}</small></div>
        <div class="der"><b>${eur(i.usado, 3)}</b><small>/ ${esc(i.unidad)}${i.variacion != null && Math.abs(i.variacion) >= 0.01 ? ` · <span class="${i.variacion > 0 ? 'sub' : 'baj'}">${i.variacion > 0 ? '+' : ''}${pct(i.variacion)}</span>` : ''}</small></div>
      </div>`).join('') || '<div class="vacio">Nada que mostrar</div>'}</div>
    <p class="nota">Verde: precio medio de las facturas del mes. Ámbar: media de facturas anteriores. Rojo: aún con el precio del Excel 2021.</p>`;
  $('#q').oninput = e => { st.q = e.target.value; const pos = e.target.selectionStart; vistaIng(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); };
  $('#cTodos').onclick = () => { st.soloSubidas = false; vistaIng(); };
  $('#cSub').onclick = () => { st.soloSubidas = true; vistaIng(); };
}

function vistaPend() {
  const d = st.datos;
  const opts = d.ingredientes.filter(i => i.tipo === 'Compra').map(i => `<option value="${esc(i.nombre)}">`).join('');
  $('#cont').innerHTML = `
    <p class="nota">Productos de factura que todavía no están vinculados a un ingrediente. Al asignarlos, su precio entra en el escandallo.</p>
    <datalist id="dlIng">${opts}</datalist>
    <div class="lista">${d.pendientes.map((p, k) => `
      <div class="pend">
        <b>${esc(p.producto)}</b><br><small style="color:var(--gris)">${esc(p.proveedor || '')} · ${p.lineas} línea${p.lineas > 1 ? 's' : ''} · ${eur(p.importe)} · unidad factura: ${esc(p.unidad || '—')}</small>
        <div class="grid">
          <div class="campo"><label>Ingrediente</label><input list="dlIng" id="pi${k}" placeholder="Escribe para buscar"></div>
          <div class="campo"><label>Uds. escandallo por ud. factura</label><input id="pf${k}" inputmode="decimal" value="1"></div>
        </div><br>
        <button class="btn" data-k="${k}">Asignar</button>
      </div>`).join('') || '<div class="vacio">✓ Todos los productos de las facturas están asignados</div>'}</div>
    <p class="nota">Ejemplo de factor: si la factura cuenta cajas de 30 paquetes de 12 tapas y el escandallo usa tapas sueltas, pon 360. Si la factura ya viene en kg, l o unidades iguales a las del escandallo, deja 1.</p>`;
  document.querySelectorAll('.pend .btn').forEach(b => b.onclick = async () => {
    const k = b.dataset.k, p = d.pendientes[k];
    const ing = $('#pi' + k).value.trim(), f = $('#pf' + k).value.trim() || '1';
    if (!d.ingredientes.some(i => i.nombre === ing)) { toast('Elige un ingrediente de la lista'); return; }
    b.disabled = true; b.textContent = 'Guardando…';
    try { await llamar({ action: 'asignar', producto: p.producto, ingrediente: ing, factor: f, proveedor: p.proveedor || '' }); toast('Asignado'); cargar(); }
    catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Asignar'; }
  });
}

function abrirHoja(html) { $('#hoja').innerHTML = '<div class="asa"></div><button class="cerrar" onclick="cerrarHoja()" aria-label="Cerrar">✕</button>' + html; $('#hoja').scrollTop = 0; $('#velo').classList.add('on'); $('#hoja').classList.add('on'); }
function cerrarHoja() { $('#velo').classList.remove('on'); $('#hoja').classList.remove('on'); }
$('#velo').onclick = cerrarHoja;

cargar();
</script>
</body>
</html>
