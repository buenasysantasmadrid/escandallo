<!DOCTYPE html>
<!-- App del escandallo en GitHub Pages (https://buenasysantasmadrid.github.io/escandallo).
     Entra con Google y habla con el Apps Script (doPost de Code.gs), que comprueba la cuenta. -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4f3a">
<title>Escandallo · Buenas y Santas</title>
<style>
:root{
  --verde:#2f4f3a; --verde2:#4b7a5a; --crema:#faf7f0; --tinta:#1f2421; --gris:#6b716d; --linea:#e6e1d6;
  --ok:#2e7d4f; --okbg:#e3f2e8; --warn:#9a6a00; --warnbg:#fff1cc; --mal:#b3261e; --malbg:#fbe1df; --card:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--crema);color:var(--tinta);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--verde);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:17px;margin:0;flex:1;letter-spacing:.2px}
.top h1 small{display:block;font-weight:400;opacity:.75;font-size:12px}
.mes{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:6px 8px;font:inherit;font-size:14px;color-scheme:dark}
button.icono{background:none;border:0;color:#fff;font-size:20px;padding:6px;cursor:pointer}
nav{display:flex;gap:4px;margin-top:10px}
nav button{flex:1;background:none;border:0;color:rgba(255,255,255,.7);padding:10px 4px;font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;border-color:#e9c46a}
nav .badge{background:#e9c46a;color:var(--tinta);border-radius:10px;padding:0 6px;font-size:12px;margin-left:4px}
main{padding:12px 16px 90px;max-width:820px;margin:0 auto}
.buscar{width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:10px;font:inherit;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--linea);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--tinta)}
.chip.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.kpi{background:var(--card);border-radius:12px;padding:10px;border:1px solid var(--linea)}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:var(--gris)}
.lista{display:flex;flex-direction:column;gap:8px}
.fila{background:var(--card);border:1px solid var(--linea);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.fila .nom{flex:1;min-width:0}
.fila .nom b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .nom small{color:var(--gris);font-size:12.5px}
.der{text-align:right;white-space:nowrap}
.der b{display:block}
.der small{color:var(--gris);font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600}
.p-ok{background:var(--okbg);color:var(--ok)} .p-warn{background:var(--warnbg);color:var(--warn)} .p-mal{background:var(--malbg);color:var(--mal)} .p-gris{background:#eee;color:var(--gris)} .p-azul{background:#dde8f6;color:#1f4f8a}
.viejo{color:var(--mal);font-weight:600}
tr.tviejo td:first-child{border-left:3px solid var(--mal)}
.rec{display:flex;flex-direction:column;gap:8px}
.rlin{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:8px;display:grid;grid-template-columns:1fr 84px 32px;gap:6px;align-items:center}
.rlin input{width:100%;padding:8px;border:1px solid var(--linea);border-radius:8px;font:inherit;background:#fff}
.rlin small{grid-column:1/-1;color:var(--gris);font-size:12px}
.quitar{background:#f3efe6;border:0;border-radius:8px;height:36px;cursor:pointer;color:var(--mal);font-size:16px}
.quitar.mini{height:28px;width:28px;font-size:13px;padding:0}
.candado{background:#f3efe6;border:0;border-radius:8px;width:36px;height:36px;font-size:17px;cursor:pointer;margin-left:6px;flex:none}
.candado.on{background:#dde8f6}
.fila2{display:flex;gap:8px;margin-top:10px}
.fila2 .btn{flex:1}
.sub{color:var(--mal);font-weight:600} .baj{color:var(--ok);font-weight:600}
.vacio{text-align:center;color:var(--gris);padding:40px 10px}
.cargando{text-align:center;color:var(--gris);padding:60px 0}
/* hoja de detalle */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.velo.on{display:block}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--crema);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .22s ease;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);max-width:820px;margin:0 auto}
.hoja.on{transform:none}
.asa{width:40px;height:4px;background:#ccc;border-radius:4px;margin:6px auto 12px}
.cerrar{position:sticky;top:0;float:right;background:#e9e4d8;border:0;border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer;color:var(--tinta)}
.hoja h2{margin:0 0 2px;font-size:19px}
.hoja .meta{color:var(--gris);font-size:13px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--linea)}
th,td{padding:8px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--linea)}
th{background:#f3efe6;font-size:12px;color:var(--gris);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;background:#f3efe6}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.campo label{display:block;font-size:12px;color:var(--gris);margin-bottom:4px}
.campo input,.campo select{width:100%;padding:10px;border:1px solid var(--linea);border-radius:10px;font:inherit;background:#fff}
.btn{background:var(--verde);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn:disabled{opacity:.5}
.btn.sec{background:#fff;color:var(--verde);border:1px solid var(--verde)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:10px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.pend{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px}
.pend .grid{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:10px}
.nota{font-size:12.5px;color:var(--gris);margin:8px 0}
.entrar{max-width:360px;margin:18vh auto 0;text-align:center;padding:0 16px}
.entrar h1{color:var(--verde);font-size:24px;margin:0 0 4px}
.entrar p{color:var(--gris);margin:0 0 24px}
#botonGoogle{display:flex;justify-content:center;min-height:44px}
.salir{background:none;border:0;color:#fff;opacity:.75;font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0;margin-left:6px}
@media (min-width:700px){.resumen{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app"><div class="cargando">Cargando…</div></div>
<div class="velo" id="velo"></div>
<div class="hoja" id="hoja"></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const eur = (n, d = 2) => n == null ? '—' : n.toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' €';
const pct = n => n == null ? '—' : (n * 100).toLocaleString('es-ES', { maximumFractionDigits: 1 }) + ' %';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const leer = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

const st = { datos: null, tab: leer('esc_tab') || 'carta', cat: 'Todas', q: '', soloSubidas: false };

// ---- Configuración ----
// URL /exec del Apps Script (la de .claude/implementacion.txt) y el ID de cliente OAuth de Google Cloud.
const API_URL = 'https://script.google.com/macros/s/AKfycbz1X3Im_cZMZGlmjvv4IZnVbIu-e3Qgf9wGeW0lnosHaNsQhLiOo4nzZxV-HujMFBVvEQ/exec';
const CLIENT_ID = '1050764622239-lbl39rs0pjcr1ms46eldrd4e680kvscr.apps.googleusercontent.com';

// ---- Sesión con Google ----
// El token de Google dura 1 hora; se guarda en este navegador para no pedir entrar cada vez.
let token = null;
function tokenGuardado() {
  try {
    const t = leer('esc_token'); if (!t) return null;
    const exp = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000;
    return exp - Date.now() > 60000 ? t : null;
  } catch (e) { return null; }
}
function pantallaEntrar(msg) {
  token = null; guardar('esc_token', '');
  $('#app').innerHTML = `<div class="entrar"><h1>Escandallo</h1><p>Buenas y Santas</p><div id="botonGoogle"></div>
    ${msg ? `<p class="nota" style="margin-top:20px;color:var(--mal)">${esc(msg)}</p>` : ''}</div>`;
  if (CLIENT_ID === 'PENDIENTE') { $('#botonGoogle').innerHTML = '<p class="nota">Falta configurar el inicio de sesión con Google (CLIENT_ID).</p>'; return; }
  const pintarBoton = () => {
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: r => { token = r.credential; guardar('esc_token', token); cargar(); }, auto_select: true });
    google.accounts.id.renderButton($('#botonGoogle'), { theme: 'filled_blue', size: 'large', text: 'signin_with', shape: 'pill', locale: 'es' });
    google.accounts.id.prompt();
  };
  if (window.google && google.accounts) pintarBoton(); else window.addEventListener('load', pintarBoton, { once: true });
}
function salir() { try { google.accounts.id.disableAutoSelect(); } catch (e) {} pantallaEntrar(); }

// Llama a doPost de Code.gs. Sin cabecera Content-Type (va como texto) para que el navegador no haga preflight.
async function llamar(params) {
  if (!token) { pantallaEntrar(); throw new Error('Hay que entrar con Google'); }
  let j;
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ token }, params)) });
    j = await r.json();
  } catch (e) { throw new Error('No hay conexión con el escandallo. Prueba otra vez.'); }
  if (!j.ok && j.sesion) { pantallaEntrar(j.error); throw new Error(j.error); }
  if (!j.ok) throw new Error(j.error || 'Error');
  return j;
}

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }

function cargar() {
  $('#app').innerHTML = '<div class="cargando">Cargando escandallo…</div>';
  return llamar({ action: 'datos' }).then(j => { st.datos = j; st.ingIdx = null; pintar(); })
    .catch(e => { if (!token) return; $('#app').innerHTML = `<div class="vacio">No se pudo cargar: ${esc(e.message)}<br><br><button class="btn sec" onclick="cargar()">Reintentar</button></div>`; });
}

function pintar() {
  const d = st.datos; const np = d.pendientes.length;
  $('#app').innerHTML = `
  <header>
    <div class="top">
      <h1>Escandallo<small>${esc(d.usuario || "Buenas y Santas")}<button class="salir" onclick="salir()">salir</button></small></h1>
      <input type="month" class="mes" id="mes" value="${esc(d.config.mes)}">
      <button class="icono" id="recargar" title="Recargar">↻</button>
    </div>
    <nav>
      <button data-t="carta" class="${st.tab === 'carta' ? 'on' : ''}">Carta</button>
      <button data-t="ing" class="${st.tab === 'ing' ? 'on' : ''}">Ingredientes</button>
      <button data-t="pend" class="${st.tab === 'pend' ? 'on' : ''}">Facturas${np ? `<span class="badge">${np}</span>` : ''}</button>
    </nav>
  </header>
  <main id="cont"></main>`;
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { st.tab = b.dataset.t; st.q = ''; guardar('esc_tab', st.tab); pintar(); });
  $('#recargar').onclick = cargar;
  $('#mes').onchange = e => { const v = e.target.value; if (!v) return; $('#cont').innerHTML = '<div class="cargando">Recalculando…</div>'; llamar({ action: 'mes', fecha: v }).then(cargar).catch(err => toast(err.message)); };
  ({ carta: vistaCarta, ing: vistaIng, pend: vistaPend })[st.tab]();
}

// ---- Origen del precio de cada ingrediente ----
// Nuevo = facturas (del mes o anteriores) o manual. Viejo = todavía con el precio del Excel 2021.
const ORIGEN = {
  'Facturas del mes': ['p-ok', 'Factura del mes'],
  'Facturas (histórico)': ['p-ok', 'Factura anterior'],
  'Manual': ['p-azul', '🔒 Bloqueado'],
  'Ref. 2021': ['p-mal', 'Precio viejo 2021'],
  'Receta propia': ['p-gris', 'Receta propia'],
  'Importe fijo': ['p-gris', 'Importe fijo']
};
const pillOrigen = i => { const [c, t] = ORIGEN[i.origen] || ['p-gris', i.origen || '—'];
  return `<span class="pill ${c}">${esc(i.usado ? t : (i.origen === 'Ref. 2021' ? 'Sin precio' : t))}</span>`; };
const esViejo = i => !i || i.origen === 'Ref. 2021' || (i.tipo === 'Compra' && !i.usado);

// Ingredientes con precio viejo o sin precio en la receta de un plato (también dentro de sus elaboraciones).
function viejosDe(nombre, visto = new Set()) {
  if (visto.has(nombre)) return new Set(); visto.add(nombre);
  const d = st.datos, out = new Set();
  const ing = st.ingIdx || (st.ingIdx = Object.fromEntries(d.ingredientes.map(i => [i.nombre, i])));
  d.recetas.filter(r => r.plato === nombre).forEach(r => {
    const i = ing[r.ing];
    if (i && i.tipo === 'Elaboración') viejosDe(r.ing, visto).forEach(x => out.add(x));
    else if (esViejo(i)) out.add(r.ing);
  });
  return out;
}
const num = s => { s = String(s ?? '').trim(); if (!s) return NaN; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return Number(s); };
const fmt = n => n == null || isNaN(n) ? '' : String(Math.round(n * 10000) / 10000).replace('.', ',');

function claseFc(p) {
  if (p.tipo === 'Elaboración') return ['p-gris', 'Elaboración'];
  if (p.aviso === 'Falta receta') return ['p-gris', 'Falta receta'];
  if (p.aviso === 'PVP por debajo del mínimo') return ['p-mal', pct(p.fc)];
  if (p.aviso === 'Food cost alto') return ['p-warn', pct(p.fc)];
  if (p.fc == null) return ['p-gris', 'Sin PVP'];
  return ['p-ok', pct(p.fc)];
}

function vistaCarta() {
  const d = st.datos;
  const cats = ['Todas', ...new Set(d.platos.filter(p => p.tipo === 'Plato').map(p => p.cat)), 'Elaboraciones', 'Con aviso', 'Precios viejos'];
  const viejos = Object.fromEntries(d.platos.map(p => [p.nombre, viejosDe(p.nombre).size]));
  let L = d.platos.filter(p => {
    if (st.cat === 'Elaboraciones') return p.tipo === 'Elaboración';
    if (st.cat === 'Precios viejos') return viejos[p.nombre] > 0;
    if (p.tipo === 'Elaboración') return false;
    if (st.cat === 'Con aviso') return p.aviso && p.aviso !== 'OK';
    return st.cat === 'Todas' || p.cat === st.cat;
  });
  if (st.q) L = L.filter(p => p.nombre.toLowerCase().includes(st.q.toLowerCase()));
  const carta = d.platos.filter(p => p.tipo === 'Plato' && p.fc != null);
  const fcMedio = carta.length ? carta.reduce((a, p) => a + p.fc, 0) / carta.length : null;
  const bajoMin = d.platos.filter(p => p.aviso === 'PVP por debajo del mínimo').length;
  const delMes = d.ingredientes.filter(i => i.origen === 'Facturas del mes').length;
  const compra = d.ingredientes.filter(i => i.tipo === 'Compra').length;
  $('#cont').innerHTML = `
    <div class="resumen">
      <div class="kpi"><b>${pct(fcMedio)}</b><span>Food cost medio</span></div>
      <div class="kpi"><b style="color:${bajoMin ? 'var(--mal)' : 'inherit'}">${bajoMin}</b><span>PVP bajo mínimo</span></div>
      <div class="kpi"><b>${delMes}/${compra}</b><span>Precios del mes</span></div>
    </div>
    <input class="buscar" id="q" placeholder="Buscar plato…" value="${esc(st.q)}">
    <div class="chips">${cats.map(c => `<button class="chip ${c === st.cat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    ${st.cat === 'Elaboraciones' ? `<button class="btn sec" id="nuevaElab" style="margin-bottom:10px">+ Nueva elaboración</button>
    <p class="nota">Una elaboración es una receta que se usa dentro de otros platos (la hamburguesa casera, una salsa, un rebozado…). Se crea aquí y después aparece como ingrediente.</p>` : ''}
    <div class="lista">${L.map((p, i) => { const [cl, tx] = claseFc(p); return `
      <div class="fila" data-i="${d.platos.indexOf(p)}">
        <div class="nom"><b>${esc(p.nombre)}</b><small>${esc(p.cat)} · coste ${eur(p.costeRacion, p.tipo === 'Elaboración' ? 3 : 2)}${p.tipo === 'Elaboración' ? ' / ' + esc(p.unidad === 'kg' ? 'kg' : 'ud') : ''}${viejos[p.nombre] ? ` · <span class="viejo">${viejos[p.nombre]} precio${viejos[p.nombre] > 1 ? 's' : ''} viejo${viejos[p.nombre] > 1 ? 's' : ''}</span>` : ''}</small></div>
        <div class="der">${p.tipo === 'Plato' ? `<b>${eur(p.pvp)}</b>` : ''}<span class="pill ${cl}">${tx}</span></div>
      </div>`; }).join('') || '<div class="vacio">Nada que mostrar</div>'}</div>
    <p class="nota">Food cost = coste por ración ÷ PVP sin IVA. Mínimo = coste × coeficiente (${String(d.config.coef).replace('.', ',')}) + IVA.</p>`;
  $('#q').oninput = e => { st.q = e.target.value; const pos = e.target.selectionStart; vistaCarta(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); };
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { st.cat = b.dataset.c; vistaCarta(); });
  document.querySelectorAll('.fila').forEach(f => f.onclick = () => detallePlato(d.platos[f.dataset.i]));
  if ($('#nuevaElab')) $('#nuevaElab').onclick = nuevaElab;
}

function nuevaElab() {
  const cats = [...new Set(st.datos.platos.map(p => p.cat).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('');
  abrirHoja(`
    <h2>Nueva elaboración</h2>
    <datalist id="dlCat">${cats}</datalist>
    <div class="edit">
      <div class="campo" style="grid-column:1/-1"><label>Nombre (por ejemplo: Hamburguesa veggie (elab.))</label><input id="eNom"></div>
      <div class="campo"><label>Cuánto sale de la receta</label><input id="eRend" inputmode="decimal" placeholder="70"></div>
      <div class="campo"><label>Unidad (ud, kg, l…)</label><input id="eUd" value="ud"></div>
      <div class="campo" style="grid-column:1/-1"><label>Categoría</label><input id="eCat" list="dlCat"></div>
    </div>
    <button class="btn" id="eCrear">Crear y escribir su receta</button>
    <p class="nota">Ejemplo: la hamburguesa casera sale 70 ud de una receta con 10 kg de carne. Al usarla en un plato pondrás 1 ud.</p>`);
  $('#eCrear').onclick = async () => {
    const nombre = $('#eNom').value.trim(), rend = $('#eRend').value.trim(), unidad = $('#eUd').value.trim(), cat = $('#eCat').value.trim();
    if (!nombre || !unidad || !(num(rend) > 0)) { toast('Falta el nombre, cuánto sale o la unidad'); return; }
    const b = $('#eCrear'); b.disabled = true; b.textContent = 'Creando…';
    try {
      await llamar({ action: 'nuevaElab', nombre, rend: String(num(rend)), unidad, cat });
      cerrarHoja(); toast('Elaboración creada');
      await cargar();
      const p = st.datos.platos.find(x => x.nombre === nombre); if (p) editarReceta(p);
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Crear y escribir su receta'; }
  };
}

function detallePlato(p) {
  const d = st.datos;
  const lin = d.recetas.filter(r => r.plato === p.nombre);
  const ingIdx = Object.fromEntries(d.ingredientes.map(i => [i.nombre, i]));
  const total = lin.reduce((a, r) => a + (r.coste || 0), 0);
  const esPlato = p.tipo === 'Plato';
  const viejos = viejosDe(p.nombre);
  abrirHoja(`
    <h2>${esc(p.nombre)}</h2>
    <div class="meta">${esc(p.cat)} · receta para ${String(p.rend).replace('.', ',')} ${p.rend != 1 && p.unidad === 'ración' ? 'raciones' : esc(p.unidad)}</div>
    ${viejos.size ? `<p class="nota viejo">Ojo: ${viejos.size} ingrediente${viejos.size > 1 ? 's' : ''} con precio viejo (2021) o sin precio: ${esc([...viejos].join(', '))}. El coste puede no ser real.</p>` : ''}
    <div class="resumen">
      <div class="kpi"><b>${eur(p.costeRacion, esPlato ? 2 : 3)}</b><span>Coste / ${esPlato ? 'ración' : esc(p.unidad)}</span></div>
      ${esPlato ? `<div class="kpi"><b>${eur(p.pvpMin)}</b><span>PVP mínimo</span></div>
      <div class="kpi"><b>${pct(p.fc)}</b><span>Food cost</span></div>` : ''}
    </div>
    <table><thead><tr><th>Ingrediente</th><th class="n">Cant.</th><th class="n">€/ud</th><th class="n">Coste</th><th></th></tr></thead><tbody>
    ${lin.map((r, k) => { const ig = ingIdx[r.ing] || {}; const v = ig.variacion;
      const vj = ig.tipo === 'Elaboración' ? viejosDe(r.ing).size > 0 : esViejo(ingIdx[r.ing]);
      return `<tr class="${vj ? 'tviejo' : ''}"><td>${esc(r.ing)}<br><small>${pillOrigen(ig)}${ig.tipo === 'Elaboración' && vj ? ' <span class="viejo">lleva precios viejos</span>' : ''}${v != null && Math.abs(v) >= 0.01 ? ` <span class="${v > 0 ? 'sub' : 'baj'}">${v > 0 ? '+' : ''}${pct(v)} vs 2021</span>` : ''}</small></td>
      <td class="n">${String(r.cant).replace('.', ',')} ${esc(r.unidad)}</td><td class="n">${eur(r.precio, 3)}</td><td class="n">${eur(r.coste)}</td>
      <td class="n"><button class="quitar mini" data-borrar="${k}" title="Quitar de la receta" aria-label="Quitar ${esc(r.ing)}">✕</button></td></tr>`; }).join('')}
    </tbody><tfoot><tr><td colspan="3">Total receta</td><td class="n">${eur(total)}</td><td></td></tr></tfoot></table>
    ${lin.length ? '' : '<p class="nota viejo">Este plato todavía no tiene receta: añade sus productos aquí abajo con el +.</p>'}
    <datalist id="dlAdd">${d.ingredientes.filter(i => i.nombre !== p.nombre).map(i => `<option value="${esc(i.nombre)}">`).join('')}</datalist>
    <div class="rlin" style="margin-top:8px;grid-template-columns:1fr 84px 44px">
      <input list="dlAdd" id="aIng" placeholder="Añadir producto…">
      <input id="aCant" inputmode="decimal" placeholder="Cant.">
      <button class="btn" id="aMas" style="padding:8px" aria-label="Añadir">+</button>
      <small id="aInfo">Escribe el producto, la cantidad y pulsa +</small>
    </div>
    ${p.coste2021 != null ? `<p class="nota">Coste por ración en el Excel 2021: ${eur(p.coste2021, esPlato ? 2 : 3)}</p>` : ''}
    ${esPlato ? `
    <div class="edit">
      <div class="campo"><label>PVP carta (IVA incl.)</label><input id="ePvp" inputmode="decimal" value="${p.pvp != null ? String(p.pvp).replace('.', ',') : ''}"></div>
      <div class="campo"><label>Coeficiente (vacío = ${String(d.config.coef).replace('.', ',')})</label><input id="eCoef" inputmode="decimal" value="${p.coef != null ? String(p.coef).replace('.', ',') : ''}"></div>
    </div>
    <button class="btn" id="eGuardar">Guardar PVP y coeficiente</button>` : ''}
    <div class="fila2"><button class="btn sec" id="eReceta">✎ ${lin.length ? 'Modificar la receta' : 'Crear la receta'}</button></div>`);
  $('#eReceta').onclick = () => editarReceta(p);
  const actuales = () => lin.map(r => ({ ing: r.ing, cant: String(r.cant), nota: r.nota || '' }));
  $('#aIng').oninput = () => { const i = ingIdx[$('#aIng').value.trim()];
    $('#aInfo').innerHTML = i ? `En ${esc(i.unidad)} · ${eur(i.usado, 3)}/${esc(i.unidad)} ${pillOrigen(i)}` : 'Escribe el producto, la cantidad y pulsa +'; };
  $('#aMas').onclick = async () => {
    const ing = $('#aIng').value.trim(), cant = num($('#aCant').value);
    if (!ingIdx[ing]) { toast('Elige un producto de la lista (o créalo en Ingredientes)'); return; }
    if (!(cant > 0)) { toast('Pon la cantidad'); return; }
    await guardarLineas(p, [...actuales(), { ing, cant: String(cant), nota: '' }], $('#aMas'), 'Añadido');
  };
  document.querySelectorAll('[data-borrar]').forEach(b => b.onclick = async () => {
    const k = Number(b.dataset.borrar);
    if (!confirm(`¿Quitar ${lin[k].ing} de ${p.nombre}?`)) return;
    await guardarLineas(p, actuales().filter((_, j) => j !== k), b, 'Quitado');
  });
  if (esPlato) $('#eGuardar').onclick = async () => {
    const b = $('#eGuardar'); b.disabled = true; b.textContent = 'Guardando…';
    try {
      const pvp = $('#ePvp').value.trim(), coef = $('#eCoef').value.trim();
      if (pvp && pvp !== String(p.pvp ?? '').replace('.', ',')) await llamar({ action: 'pvp', plato: p.nombre, valor: pvp });
      if (coef !== String(p.coef ?? '').replace('.', ',')) await llamar({ action: 'coef', plato: p.nombre, valor: coef });
      cerrarHoja(); toast('Guardado'); cargar();
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Guardar cambios'; }
  };
}

// Guarda las líneas de la receta, recarga y vuelve a abrir el plato.
async function guardarLineas(p, lineas, boton, msg) {
  if (boton) { boton.disabled = true; boton.textContent = '…'; }
  try {
    await llamar({ action: 'receta', plato: p.nombre, lineas });
    toast(msg || 'Guardado');
    await cargar();
    const nuevo = st.datos.platos.find(x => x.nombre === p.nombre); if (nuevo) detallePlato(nuevo);
  } catch (e) { toast(e.message); if (boton) { boton.disabled = false; boton.textContent = boton.dataset.borrar != null ? '✕' : '+'; } }
}

// ---- Editar receta ----
function editarReceta(p) {
  const d = st.datos;
  const ingIdx = Object.fromEntries(d.ingredientes.map(i => [i.nombre, i]));
  let lin = d.recetas.filter(r => r.plato === p.nombre).map(r => ({ ing: r.ing, cant: fmt(r.cant), nota: r.nota || '' }));
  const opts = d.ingredientes.filter(i => i.nombre !== p.nombre).map(i => `<option value="${esc(i.nombre)}">`).join('');
  const total = () => lin.reduce((a, l) => { const i = ingIdx[l.ing], c = num(l.cant); return a + (i && c > 0 ? c * (i.usado || 0) : 0); }, 0);
  const pintarLin = () => {
    $('#rLin').innerHTML = lin.map((l, k) => { const i = ingIdx[l.ing], c = num(l.cant);
      return `<div class="rlin">
        <input list="dlRec" data-k="${k}" data-f="ing" value="${esc(l.ing)}" placeholder="Ingrediente">
        <input data-k="${k}" data-f="cant" inputmode="decimal" value="${esc(l.cant)}" placeholder="Cant.">
        <button class="quitar" data-q="${k}" aria-label="Quitar">✕</button>
        <small>${i ? `${esc(i.unidad)} · ${eur(i.usado, 3)}/${esc(i.unidad)} ${pillOrigen(i)}${c > 0 ? ` · coste ${eur(c * (i.usado || 0))}` : ''}`
          : (l.ing ? '<span class="viejo">No existe ese ingrediente: elige uno de la lista o créalo en Ingredientes</span>' : 'Escribe para buscar')}</small>
      </div>`; }).join('') || '<div class="vacio">Sin ingredientes</div>';
    $('#rTotal').textContent = eur(total());
    $('#rRacion').textContent = eur(total() / (num($('#rRend').value) || 1), 3);
    document.querySelectorAll('#rLin input').forEach(el => el.onchange = () => { lin[el.dataset.k][el.dataset.f] = el.value.trim(); pintarLin(); });
    document.querySelectorAll('#rLin .quitar').forEach(b => b.onclick = () => { lin.splice(Number(b.dataset.q), 1); pintarLin(); });
  };
  abrirHoja(`
    <h2>Receta · ${esc(p.nombre)}</h2>
    <div class="meta">Cantidades en la unidad de cada ingrediente. Los cambios se ven en el coste al momento; se guardan al pulsar Guardar.</div>
    <datalist id="dlRec">${opts}</datalist>
    <div class="campo" style="margin-bottom:10px"><label>Rendimiento: cuántas ${p.unidad === 'ración' ? 'raciones' : esc(p.unidad)} salen de esta receta</label><input id="rRend" inputmode="decimal" value="${fmt(p.rend)}"></div>
    <div class="rec" id="rLin"></div>
    <div class="fila2"><button class="btn sec" id="rMas">+ Añadir ingrediente</button></div>
    <div class="resumen" style="margin-top:12px">
      <div class="kpi"><b id="rTotal">—</b><span>Total receta</span></div>
      <div class="kpi"><b id="rRacion">—</b><span>Por ${p.unidad === 'ración' ? 'ración' : esc(p.unidad)}</span></div>
    </div>
    <div class="fila2"><button class="btn sec" id="rCancelar">Cancelar</button><button class="btn" id="rGuardar">Guardar receta</button></div>`);
  pintarLin();
  $('#rRend').oninput = pintarLin;
  $('#rMas').onclick = () => { lin.push({ ing: '', cant: '', nota: '' }); pintarLin(); const ins = document.querySelectorAll('#rLin input[data-f="ing"]'); ins[ins.length - 1].focus(); };
  $('#rCancelar').onclick = () => detallePlato(p);
  $('#rGuardar').onclick = async () => {
    const malas = lin.filter(l => l.ing || l.cant).filter(l => !ingIdx[l.ing] || !(num(l.cant) > 0));
    if (malas.length) { toast('Revisa: cada línea necesita un ingrediente de la lista y una cantidad'); return; }
    const b = $('#rGuardar'); b.disabled = true; b.textContent = 'Guardando…';
    try {
      await llamar({ action: 'receta', plato: p.nombre, rend: $('#rRend').value.trim(),
        lineas: lin.filter(l => l.ing).map(l => ({ ing: l.ing, cant: String(num(l.cant)), nota: l.nota })) });
      cerrarHoja(); toast('Receta guardada'); cargar();
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Guardar receta'; }
  };
}

// ---- Ingredientes ----
function vistaIng() {
  const d = st.datos;
  let L = d.ingredientes.filter(i => i.tipo !== 'Fijo');
  if (st.filtroIng === 'subidas') L = L.filter(i => i.variacion != null && i.variacion > 0.1);
  if (st.filtroIng === 'viejos') L = L.filter(i => i.tipo === 'Compra' && esViejo(i));
  if (st.filtroIng === 'manual') L = L.filter(i => i.origen === 'Manual');
  if (st.q) L = L.filter(i => i.nombre.toLowerCase().includes(st.q.toLowerCase()));
  const nViejos = d.ingredientes.filter(i => i.tipo === 'Compra' && esViejo(i)).length;
  const chip = (k, t) => `<button class="chip ${(st.filtroIng || 'todos') === k ? 'on' : ''}" data-f="${k}">${t}</button>`;
  $('#cont').innerHTML = `
    <input class="buscar" id="q" placeholder="Buscar ingrediente…" value="${esc(st.q)}">
    <div class="chips">${chip('todos', 'Todos')}${chip('viejos', `Precio viejo (${nViejos})`)}${chip('manual', '🔒 Bloqueados')}${chip('subidas', 'Subidas &gt; 10 % vs 2021')}</div>
    <button class="btn sec" id="nuevoIng" style="margin-bottom:10px">+ Nuevo ingrediente</button>
    <div class="lista">${L.map(i => `
      <div class="fila" data-n="${esc(i.nombre)}">
        <div class="nom"><b>${esc(i.nombre)}</b><small>${pillOrigen(i)}${i.lineas ? ` · ${i.lineas} línea${i.lineas > 1 ? 's' : ''} este mes` : ''}</small></div>
        <div class="der"><b class="${i.tipo === 'Compra' && esViejo(i) ? 'viejo' : ''}">${eur(i.usado, 3)}</b><small>/ ${esc(i.unidad)}${i.variacion != null && Math.abs(i.variacion) >= 0.01 ? ` · <span class="${i.variacion > 0 ? 'sub' : 'baj'}">${i.variacion > 0 ? '+' : ''}${pct(i.variacion)}</span>` : ''}</small></div>
        ${i.tipo === 'Compra' ? `<button class="candado ${i.manual != null ? 'on' : ''}" data-lock="${esc(i.nombre)}" title="${i.manual != null ? 'Desbloquear: volver a las facturas' : 'Bloquear este precio'}">${i.manual != null ? '🔒' : '🔓'}</button>` : ''}
      </div>`).join('') || '<div class="vacio">Nada que mostrar</div>'}</div>
    <p class="nota">Verde: precio de las facturas (del mes o, si este mes no hubo compras, de meses anteriores). Rojo: todavía con el precio viejo del Excel 2021. 🔒 Azul: precio bloqueado, las facturas no lo cambian. Pulsa el candado para bloquear o desbloquear; toca el ingrediente para escribir otro precio.</p>`;
  $('#q').oninput = e => { st.q = e.target.value; const pos = e.target.selectionStart; vistaIng(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); };
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { st.filtroIng = b.dataset.f; vistaIng(); });
  document.querySelectorAll('.fila').forEach(f => f.onclick = () => detalleIng(d.ingredientes.find(i => i.nombre === f.dataset.n)));
  document.querySelectorAll('[data-lock]').forEach(b => b.onclick = async ev => {
    ev.stopPropagation();
    const i = d.ingredientes.find(x => x.nombre === b.dataset.lock);
    if (i.manual == null && !(i.usado > 0)) { detalleIng(i); toast('No tiene precio: escribe uno para bloquearlo'); return; }
    b.disabled = true; b.textContent = '…';
    try {
      await llamar({ action: 'precioManual', ingrediente: i.nombre, valor: i.manual != null ? '' : String(i.usado) });
      toast(i.manual != null ? 'Desbloqueado: usa las facturas' : 'Bloqueado a ' + eur(i.usado, 3)); cargar();
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = i.manual != null ? '🔒' : '🔓'; }
  });
  $('#nuevoIng').onclick = nuevoIng;
}

function detalleIng(i) {
  const d = st.datos;
  const usos = [...new Set(d.recetas.filter(r => r.ing === i.nombre).map(r => r.plato))];
  const fila = (t, v) => `<tr><td>${t}</td><td class="n">${v}</td></tr>`;
  const compra = i.tipo === 'Compra';
  abrirHoja(`
    <h2>${esc(i.nombre)}</h2>
    <div class="meta">${esc(i.tipo)} · por ${esc(i.unidad)}</div>
    <div class="resumen"><div class="kpi"><b>${eur(i.usado, 3)}</b><span>Precio usado</span></div><div class="kpi">${pillOrigen(i)}<span style="display:block;margin-top:4px">De dónde sale</span></div></div>
    ${compra ? `<table><tbody>
      ${fila('Facturas de este mes', i.mes != null ? eur(i.mes, 3) + (i.lineas ? ` (${i.lineas} línea${i.lineas > 1 ? 's' : ''})` : '') : '—')}
      ${fila('Facturas de meses anteriores', eur(i.hist, 3))}
      ${fila('Excel 2021 (viejo)', eur(i.ref, 3))}
      ${fila('🔒 Bloqueado', i.manual != null ? eur(i.manual, 3) : '—')}
    </tbody></table>
    <div class="edit">
      <div class="campo" style="grid-column:1/-1"><label>Precio, € por ${esc(i.unidad)}</label><input id="iMan" inputmode="decimal" value="${fmt(i.manual != null ? i.manual : i.usado)}"></div>
    </div>
    <div class="fila2">${i.manual != null ? '<button class="btn sec" id="iQuitar">🔓 Desbloquear (usar facturas)</button>' : ''}<button class="btn" id="iGuardar">🔒 ${i.manual != null ? 'Cambiar precio bloqueado' : 'Bloquear este precio'}</button></div>
    <p class="nota">Con el candado cerrado, el precio se queda fijo y las facturas nuevas no lo cambian. Con el candado abierto, se usa el precio de las facturas.</p>` : `<p class="nota">${i.tipo === 'Elaboración' ? 'Su precio sale de su propia receta (en la Carta, filtro Elaboraciones).' : 'Importe fijo por plato.'}</p>`}
    ${usos.length ? `<p class="nota">Se usa en: ${esc(usos.join(', '))}</p>` : '<p class="nota">No se usa en ninguna receta.</p>'}`);
  if (!compra) return;
  const enviar = async (valor, b) => {
    b.disabled = true; b.textContent = 'Guardando…';
    try { await llamar({ action: 'precioManual', ingrediente: i.nombre, valor }); cerrarHoja(); toast('Precio guardado'); cargar(); }
    catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Guardar precio'; }
  };
  $('#iGuardar').onclick = () => { const v = $('#iMan').value.trim(); if (!(num(v) > 0)) { toast('Escribe un precio'); return; } enviar(String(num(v)), $('#iGuardar')); };
  if ($('#iQuitar')) $('#iQuitar').onclick = () => enviar('', $('#iQuitar'));
}

function nuevoIng() {
  const unidades = [...new Set(st.datos.ingredientes.map(i => i.unidad).filter(Boolean))].map(u => `<option value="${esc(u)}">`).join('');
  abrirHoja(`
    <h2>Nuevo ingrediente</h2>
    <datalist id="dlUd">${unidades}</datalist>
    <div class="edit">
      <div class="campo" style="grid-column:1/-1"><label>Nombre</label><input id="nNom"></div>
      <div class="campo"><label>Unidad (kg, l, ud…)</label><input id="nUd" list="dlUd" value="kg"></div>
      <div class="campo"><label>Precio € por unidad (opcional)</label><input id="nPre" inputmode="decimal"></div>
    </div>
    <button class="btn" id="nGuardar">Crear ingrediente</button>
    <p class="nota">Si no pones precio, se llenará con las facturas cuando asignes un producto a este ingrediente.</p>`);
  $('#nGuardar').onclick = async () => {
    const nombre = $('#nNom').value.trim(), unidad = $('#nUd').value.trim(), pre = $('#nPre').value.trim();
    if (!nombre || !unidad) { toast('Falta el nombre o la unidad'); return; }
    if (pre && !(num(pre) > 0)) { toast('Precio no válido'); return; }
    const b = $('#nGuardar'); b.disabled = true; b.textContent = 'Guardando…';
    try { await llamar({ action: 'nuevoIng', nombre, unidad, valor: pre ? String(num(pre)) : '' }); cerrarHoja(); toast('Ingrediente creado'); cargar(); }
    catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Crear ingrediente'; }
  };
}

function vistaPend() {
  const d = st.datos;
  const opts = d.ingredientes.filter(i => i.tipo === 'Compra').map(i => `<option value="${esc(i.nombre)}">`).join('');
  $('#cont').innerHTML = `
    <p class="nota">Productos de factura que todavía no están vinculados a un ingrediente. Al asignarlos, su precio entra en el escandallo.</p>
    <datalist id="dlIng">${opts}</datalist>
    <div class="lista">${d.pendientes.map((p, k) => `
      <div class="pend">
        <b>${esc(p.producto)}</b><br><small style="color:var(--gris)">${esc(p.proveedor || '')} · ${p.lineas} línea${p.lineas > 1 ? 's' : ''} · ${eur(p.importe)} · unidad factura: ${esc(p.unidad || '—')}</small>
        <div class="grid">
          <div class="campo"><label>Ingrediente</label><input list="dlIng" id="pi${k}" placeholder="Escribe para buscar"></div>
          <div class="campo"><label>Uds. escandallo por ud. factura</label><input id="pf${k}" inputmode="decimal" value="1"></div>
        </div><br>
        <button class="btn" data-k="${k}">Asignar</button>
      </div>`).join('') || '<div class="vacio">✓ Todos los productos de las facturas están asignados</div>'}</div>
    <p class="nota">Ejemplo de factor: si la factura cuenta cajas de 30 paquetes de 12 tapas y el escandallo usa tapas sueltas, pon 360. Si la factura ya viene en kg, l o unidades iguales a las del escandallo, deja 1.</p>`;
  document.querySelectorAll('.pend .btn').forEach(b => b.onclick = async () => {
    const k = b.dataset.k, p = d.pendientes[k];
    const ing = $('#pi' + k).value.trim(), f = $('#pf' + k).value.trim() || '1';
    if (!d.ingredientes.some(i => i.nombre === ing)) { toast('Elige un ingrediente de la lista'); return; }
    b.disabled = true; b.textContent = 'Guardando…';
    try { await llamar({ action: 'asignar', producto: p.producto, ingrediente: ing, factor: f, proveedor: p.proveedor || '' }); toast('Asignado'); cargar(); }
    catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Asignar'; }
  });
}

function abrirHoja(html) { $('#hoja').innerHTML = '<div class="asa"></div><button class="cerrar" onclick="cerrarHoja()" aria-label="Cerrar">✕</button>' + html; $('#hoja').scrollTop = 0; $('#velo').classList.add('on'); $('#hoja').classList.add('on'); }
function cerrarHoja() { $('#velo').classList.remove('on'); $('#hoja').classList.remove('on'); }
$('#velo').onclick = cerrarHoja;

token = tokenGuardado();
if (token) cargar(); else pantallaEntrar();
</script>
<script src="https://accounts.google.com/gsi/client" async></script>
